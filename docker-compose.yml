services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aaspaas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aaspaas
      POSTGRES_PASSWORD: aaspaas
      POSTGRES_DB: aaspaas
    volumes:
      - aaspaas_pgdata:/var/lib/postgresql/data
      - ./backend/prisma/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaspaas -d aaspaas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aaspaas_pgdata:
